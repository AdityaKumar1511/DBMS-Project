<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance | Student Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="attendance">
    <div class="app-container">
        <aside class="app-sidebar"></aside>

        <main class="app-main">
            <header class="app-topbar">
                <div class="topbar-left">
                    <button class="mobile-toggle" id="mobile-sidebar-toggle">Menu</button>
                    <div class="page-title-group">
                        <h2>Attendance</h2>
                    </div>
                </div>
                <div class="topbar-right">
                    <button class="btn btn-secondary" id="btn-check-percentage">Attendance %</button>
                    <button class="btn btn-primary" id="btn-mark-attendance">Mark attendance</button>
                </div>
            </header>

            <div class="content-body">
                <div class="tabs">
                    <button class="tab active" id="tab-all-logs">Records</button>
                    <button class="tab" id="tab-defaulters">Defaulters</button>
                </div>

                <div class="filters-bar" id="filters-container">
                    <select id="attendance-filter-course" class="form-select">
                        <option value="">All courses</option>
                    </select>
                    <input type="date" id="attendance-filter-date" class="form-control input-auto">
                    <button class="btn btn-secondary" id="btn-reset-attendance-filter">Clear</button>
                </div>

                <div class="panel">
                    <div class="panel-header">
                        <div class="panel-title" id="panel-table-title">Attendance records</div>
                    </div>
                    <div class="table-responsive">
                        <table class="data-table">
                            <thead id="attendance-thead">
                                <tr>
                                    <th>ID</th>
                                    <th>Student</th>
                                    <th>Course</th>
                                    <th>Date</th>
                                    <th>Status</th>
                                    <th class="cell-right">Toggle</th>
                                </tr>
                            </thead>
                            <tbody id="attendance-tbody">
                                <tr><td colspan="6" class="loading-row">Loading…</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="mark-modal">
        <div class="modal-card modal-md">
            <div class="modal-header">
                <h3 class="modal-title">Mark attendance</h3>
                <button class="modal-close" onclick="closeModal('mark-modal')">&times;</button>
            </div>
            <form id="mark-form">
                <div class="modal-body">
                    <div class="form-group">
                        <label class="form-label" for="mark-course-select">Course <span class="req">*</span></label>
                        <select id="mark-course-select" class="form-control" required>
                            <option value="">Select course</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="mark-student-select">Student <span class="req">*</span></label>
                        <select id="mark-student-select" class="form-control" required>
                            <option value="">Select student</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="mark-date">Date <span class="req">*</span></label>
                            <input type="date" id="mark-date" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="mark-status">Status <span class="req">*</span></label>
                            <select id="mark-status" class="form-control" required>
                                <option value="Present">Present</option>
                                <option value="Absent">Absent</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('mark-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="proc-modal">
        <div class="modal-card modal-md">
            <div class="modal-header">
                <h3 class="modal-title">Attendance percentage</h3>
                <button class="modal-close" onclick="closeModal('proc-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <p class="page-note note-spaced">Calls <span class="mono">get_attendance_percentage()</span>.</p>
                <div class="form-group">
                    <label class="form-label" for="proc-student">Student</label>
                    <select id="proc-student" class="form-control"></select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="proc-course">Course</label>
                    <select id="proc-course" class="form-control"></select>
                </div>
                <button class="btn btn-primary btn-block" id="btn-run-proc">Run</button>

                <div id="proc-result-box" class="form-note hidden mt-16">
                    <div class="cell-primary" id="proc-res-student">—</div>
                    <div class="cell-sub" id="proc-res-course">—</div>
                    <div class="stat-number mt-8" id="proc-res-percent">0%</div>
                    <div class="cell-sub mt-6">
                        <span id="proc-res-total">0</span> lectures ·
                        <span id="proc-res-attended">0</span> attended ·
                        <span id="proc-res-absent">0</span> absent
                    </div>
                    <div class="status mt-8" id="proc-res-remark"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal('proc-modal')">Close</button>
            </div>
        </div>
    </div>

    <script src="js/layout.js"></script>
    <script src="js/api.js"></script>
    <script src="js/attendance.js"></script>
</body>
</html>
