<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marks | Student Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="marks">
    <div class="app-container">
        <aside class="app-sidebar"></aside>

        <main class="app-main">
            <header class="app-topbar">
                <div class="topbar-left">
                    <button class="mobile-toggle" id="mobile-sidebar-toggle">Menu</button>
                    <div class="page-title-group">
                        <h2>Marks</h2>
                    </div>
                </div>
            </header>

            <div class="content-body">
                <p class="page-note">Total and grade are calculated by database triggers.</p>

                <div class="filters-bar">
                    <select id="marks-filter-course" class="form-select">
                        <option value="">All courses</option>
                    </select>
                    <select id="marks-filter-semester" class="form-select">
                        <option value="">All semesters</option>
                        <option value="1">Semester 1</option>
                        <option value="2">Semester 2</option>
                        <option value="3">Semester 3</option>
                        <option value="4">Semester 4</option>
                        <option value="5">Semester 5</option>
                        <option value="6">Semester 6</option>
                        <option value="7">Semester 7</option>
                        <option value="8">Semester 8</option>
                    </select>
                    <select id="marks-filter-grade" class="form-select">
                        <option value="">All grades</option>
                        <option value="O">O</option>
                        <option value="A+">A+</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="P">P</option>
                        <option value="F">F</option>
                    </select>
                </div>

                <div class="panel">
                    <div class="panel-header">
                        <div class="panel-title">All marks</div>
                    </div>
                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Student</th>
                                    <th>Course</th>
                                    <th>Semester</th>
                                    <th>Internal</th>
                                    <th>External</th>
                                    <th>Total</th>
                                    <th>Grade</th>
                                    <th class="cell-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="marks-tbody">
                                <tr><td colspan="9" class="loading-row">Loading…</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="marks-modal">
        <div class="modal-card modal-md">
            <div class="modal-header">
                <h3 class="modal-title" id="marks-modal-title">Edit marks</h3>
                <button class="modal-close" onclick="closeModal('marks-modal')">&times;</button>
            </div>
            <form id="marks-form">
                <div class="modal-body">
                    <input type="hidden" id="marks-enrollment-id">
                    <div class="form-note form-note-spaced">
                        <div class="cell-primary" id="modal-student-desc">Student</div>
                        <div class="cell-sub" id="modal-course-desc">Course</div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="marks-internal">Internal / 40 <span class="req">*</span></label>
                            <input type="number" step="0.5" min="0" max="40" id="marks-internal" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="marks-external">External / 60 <span class="req">*</span></label>
                            <input type="number" step="0.5" min="0" max="60" id="marks-external" class="form-control" required>
                        </div>
                    </div>
                    <div class="form-note">
                        Total <span id="preview-total" class="mono">0.00</span> · Grade <span id="preview-grade" class="grade">—</span>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('marks-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="btn-save-marks">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/layout.js"></script>
    <script src="js/api.js"></script>
    <script src="js/marks.js"></script>
</body>
</html>
