<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students | Student Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="students">
    <div class="app-container">
        <aside class="app-sidebar"></aside>

        <main class="app-main">
            <header class="app-topbar">
                <div class="topbar-left">
                    <button class="mobile-toggle" id="mobile-sidebar-toggle">Menu</button>
                    <div class="page-title-group">
                        <h2>Students</h2>
                    </div>
                </div>
                <div class="topbar-right">
                    <button class="btn btn-primary" id="btn-add-student">Add student</button>
                </div>
            </header>

            <div class="content-body">
                <div class="filters-bar">
                    <div class="search-input-group">
                        <input type="text" id="filter-search" class="search-input" placeholder="Search name, email, or phone">
                    </div>
                    <select id="filter-dept" class="form-select">
                        <option value="">All departments</option>
                    </select>
                    <select id="filter-year" class="form-select">
                        <option value="">All admission years</option>
                        <option value="2024">2024</option>
                        <option value="2023">2023</option>
                        <option value="2022">2022</option>
                        <option value="2021">2021</option>
                    </select>
                    <button class="btn btn-secondary" id="btn-reset-filters">Clear</button>
                </div>

                <div class="panel">
                    <div class="panel-header">
                        <div class="panel-title">All students</div>
                        <span class="panel-count" id="students-count-badge">0 students</span>
                    </div>

                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Student</th>
                                    <th>Department</th>
                                    <th>Contact</th>
                                    <th>Batch</th>
                                    <th class="cell-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="students-tbody">
                                <tr><td colspan="6" class="loading-row">Loading…</td></tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="pagination-container">
                        <div class="pagination-info" id="pagination-info">Showing 0 of 0 students</div>
                        <div class="pagination-buttons" id="pagination-controls"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="student-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title" id="modal-title">Add student</h3>
                <button class="modal-close" onclick="closeModal('student-modal')">&times;</button>
            </div>
            <form id="student-form">
                <div class="modal-body">
                    <input type="hidden" id="student-id">

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="student-name">Full name <span class="req">*</span></label>
                            <input type="text" id="student-name" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="student-email">Email <span class="req">*</span></label>
                            <input type="email" id="student-email" class="form-control" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="student-phone">Phone</label>
                            <input type="text" id="student-phone" class="form-control">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="student-dept">Department <span class="req">*</span></label>
                            <select id="student-dept" class="form-control" required>
                                <option value="">Select department</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="student-dob">Date of birth <span class="req">*</span></label>
                            <input type="date" id="student-dob" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="student-gender">Gender <span class="req">*</span></label>
                            <select id="student-gender" class="form-control" required>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="student-year">Admission year <span class="req">*</span></label>
                            <input type="number" id="student-year" class="form-control" min="2000" max="2030" value="2024" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="student-address">Address</label>
                        <textarea id="student-address" class="form-control" rows="2"></textarea>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('student-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="btn-save-student">Save</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="delete-modal">
        <div class="modal-card modal-sm">
            <div class="modal-header">
                <h3 class="modal-title">Delete student</h3>
                <button class="modal-close" onclick="closeModal('delete-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <p id="delete-prompt-text">Delete this student and all linked records?</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal('delete-modal')">Cancel</button>
                <button type="button" class="btn btn-danger" id="btn-confirm-delete">Delete</button>
            </div>
        </div>
    </div>

    <script src="js/layout.js"></script>
    <script src="js/api.js"></script>
    <script src="js/students.js"></script>
</body>
</html>
