<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Departments | Student Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="departments">
    <div class="app-container">
        <aside class="app-sidebar"></aside>

        <main class="app-main">
            <header class="app-topbar">
                <div class="topbar-left">
                    <button class="mobile-toggle" id="mobile-sidebar-toggle">Menu</button>
                    <div class="page-title-group">
                        <h2>Departments</h2>
                    </div>
                </div>
                <div class="topbar-right">
                    <button class="btn btn-primary" id="btn-add-dept">Add department</button>
                </div>
            </header>

            <div class="content-body">
                <div class="panel">
                    <div class="panel-header">
                        <div class="panel-title">All departments</div>
                    </div>
                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Department</th>
                                    <th>Head of department</th>
                                    <th>Students</th>
                                    <th>Courses</th>
                                    <th>Faculty</th>
                                    <th class="cell-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="depts-tbody">
                                <tr><td colspan="7" class="loading-row">Loading…</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="dept-modal">
        <div class="modal-card modal-md">
            <div class="modal-header">
                <h3 class="modal-title" id="dept-modal-title">Add department</h3>
                <button class="modal-close" onclick="closeModal('dept-modal')">&times;</button>
            </div>
            <form id="dept-form">
                <div class="modal-body">
                    <input type="hidden" id="dept-id">
                    <div class="form-group">
                        <label class="form-label" for="dept-name">Department name <span class="req">*</span></label>
                        <input type="text" id="dept-name" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="dept-hod">Head of department <span class="req">*</span></label>
                        <input type="text" id="dept-hod" class="form-control" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('dept-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="btn-save-dept">Save</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="delete-modal">
        <div class="modal-card modal-sm">
            <div class="modal-header">
                <h3 class="modal-title">Delete department</h3>
                <button class="modal-close" onclick="closeModal('delete-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <p id="delete-prompt-text">Delete this department?</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal('delete-modal')">Cancel</button>
                <button type="button" class="btn btn-danger" id="btn-confirm-delete">Delete</button>
            </div>
        </div>
    </div>

    <script src="js/layout.js"></script>
    <script src="js/api.js"></script>
    <script src="js/departments.js"></script>
</body>
</html>
